name: Deploy BidMyLot to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidmylot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, check and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Prepare backend
        run: |
          npm ci --omit=dev --workspace @bidmylot/backend
          mkdir -p deploy/backend
          cp backend/app.js backend/package.json deploy/backend/
          cp -r backend/dist backend/migrations node_modules deploy/backend/

      - name: Upload backend
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: deploy/backend
          target: /home/dcgixwyd/bidmylot.backend
          strip_components: 2
          overwrite: true

      - name: Restart Passenger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            set -eu
            cd /home/dcgixwyd/bidmylot.backend
            test -f app.js
            test -f dist/app.js
            test -f .env
            mkdir -p uploads private_uploads tmp
            touch tmp/restart.txt

      - name: Prepare frontend
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/. deploy/frontend/

      - name: Upload frontend
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: deploy/frontend
          target: /home/dcgixwyd/bidmylot.com
          strip_components: 2
          overwrite: true

# Required GitHub secrets:
# CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_PORT
#
# Create /home/dcgixwyd/bidmylot.backend/.env manually before the first deploy.
# Database migrations are manual and are never run