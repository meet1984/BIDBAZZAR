name: Deploy BidMyLot to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidmylot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, check and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Validate Deployment Secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          MISSING=""
          [ -z "$CPANEL_HOST" ] && MISSING="$MISSING CPANEL_HOST"
          [ -z "$CPANEL_USER" ] && MISSING="$MISSING CPANEL_USER"
          [ -z "$CPANEL_SSH_KEY" ] && MISSING="$MISSING CPANEL_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required deployment secrets:$MISSING. Ensure they are configured in GitHub Settings -> Environments -> production OR Repository Secrets."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Prepare backend
        run: |
          npm ci --omit=dev --workspace @bidmylot/backend
          mkdir -p deploy/backend
          cp backend/app.js backend/package.json deploy/backend/
          cp -r backend/dist backend/migrations node_modules deploy/backend/
          rm -rf deploy/backend/node_modules/@bidmylot

      - name: Upload backend
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          TARGET_DIR="/home/${CPANEL_USER}/bidmylot.backend"
          SSH_CMD="ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"

          echo "Ensuring remote directory $TARGET_DIR exists on $CPANEL_HOST:$PORT..."
          $SSH_CMD "$CPANEL_USER@$CPANEL_HOST" "mkdir -p $TARGET_DIR"

          echo "Streaming backend archive to $TARGET_DIR..."
          tar -czf - -C deploy/backend . | $SSH_CMD "$CPANEL_USER@$CPANEL_HOST" "tar -xzf - -C $TARGET_DIR"
          echo "Backend upload completed."

      - name: Restart Passenger
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 "$CPANEL_USER@$CPANEL_HOST" << EOF
            set -eu
            BACKEND="/home/${CPANEL_USER}/bidmylot.backend"
            echo "Checking \$BACKEND structure..."

            [ -d "\$BACKEND" ] || { echo "ERROR: backend directory is missing"; exit 1; }
            [ -f "\$BACKEND/app.js" ] || { echo "ERROR: app.js is missing"; exit 1; }
            [ -f "\$BACKEND/dist/app.js" ] || { echo "ERROR: dist/app.js is missing"; exit 1; }
            [ -f "\$BACKEND/package.json" ] || { echo "ERROR: package.json is missing"; exit 1; }
            [ -d "\$BACKEND/node_modules" ] || { echo "ERROR: node_modules is missing"; exit 1; }

            if [ -f "\$BACKEND/.env" ]; then
              echo "Environment: .env file found"
            else
              echo "Environment: .env not found; ensure cPanel environment variables or .env file are configured"
            fi

            mkdir -p "\$BACKEND/uploads" "\$BACKEND/private_uploads" "\$BACKEND/tmp"
            touch "\$BACKEND/tmp/restart.txt"
            echo "Passenger restart requested successfully"
          EOF

      - name: Prepare frontend
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/. deploy/frontend/

      - name: Upload frontend
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          TARGET_DIR="/home/${CPANEL_USER}/bidmylot.com"
          SSH_CMD="ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15"

          echo "Ensuring remote directory $TARGET_DIR exists on $CPANEL_HOST:$PORT..."
          $SSH_CMD "$CPANEL_USER@$CPANEL_HOST" "mkdir -p $TARGET_DIR"

          echo "Streaming frontend archive to $TARGET_DIR..."
          tar -czf - -C deploy/frontend . | $SSH_CMD "$CPANEL_USER@$CPANEL_HOST" "tar -xzf - -C $TARGET_DIR"
          echo "Frontend upload completed."