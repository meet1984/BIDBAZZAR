name: Deploy BidMyLot to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidmylot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, check and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.CPANEL_PORT }}" -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare backend
        run: |
          npm ci --omit=dev --workspace @bidmylot/backend
          mkdir -p deploy/backend
          cp backend/app.js backend/package.json deploy/backend/
          cp -r backend/dist backend/migrations node_modules deploy/backend/
          rm -rf deploy/backend/node_modules/@bidmylot

      - name: Upload backend
        run: |
          SSH_CMD="ssh -p ${{ secrets.CPANEL_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
          $SSH_CMD ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "mkdir -p /home/dcgixwyd/bidmylot.backend"
          tar -czf - -C deploy/backend . | $SSH_CMD ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "tar -xzf - -C /home/dcgixwyd/bidmylot.backend"

      - name: Restart Passenger
        run: |
          SSH_CMD="ssh -p ${{ secrets.CPANEL_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
          $SSH_CMD ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'
            set -eu
            BACKEND=/home/dcgixwyd/bidmylot.backend
            echo "Checking $BACKEND"

            [ -d "$BACKEND" ] || { echo "ERROR: backend directory is missing"; exit 1; }
            [ -f "$BACKEND/app.js" ] || { echo "ERROR: app.js is missing"; exit 1; }
            [ -f "$BACKEND/dist/app.js" ] || { echo "ERROR: dist/app.js is missing"; exit 1; }
            [ -f "$BACKEND/package.json" ] || { echo "ERROR: package.json is missing"; exit 1; }
            [ -d "$BACKEND/node_modules" ] || { echo "ERROR: node_modules is missing"; exit 1; }

            if [ -f "$BACKEND/.env" ]; then
              echo "Environment: .env file found"
            else
              echo "Environment: .env not found; cPanel variables must be configured"
            fi

            mkdir -p "$BACKEND/uploads" "$BACKEND/private_uploads" "$BACKEND/tmp"
            touch "$BACKEND/tmp/restart.txt"
            echo "Passenger restart requested successfully"
          EOF

      - name: Prepare frontend
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/. deploy/frontend/

      - name: Upload frontend
        run: |
          SSH_CMD="ssh -p ${{ secrets.CPANEL_PORT }} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
          $SSH_CMD ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "mkdir -p /home/dcgixwyd/bidmylot.com"
          tar -czf - -C deploy/frontend . | $SSH_CMD ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "tar -xzf - -C /home/dcgixwyd/bidmylot.com"

# Required GitHub secrets:
# CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY, CPANEL_PORT
#
# Create /home/dcgixwyd/bidmylot.backend/.env manually before the first deploy.
# Database migrations are manual and are never run automatically in CI/CD.