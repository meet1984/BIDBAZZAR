name: Deploy BidMyLot to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidmylot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, check and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Validate Deployment Secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          MISSING=""
          [ -z "$CPANEL_HOST" ] && MISSING="$MISSING CPANEL_HOST"
          [ -z "$CPANEL_USER" ] && MISSING="$MISSING CPANEL_USER"
          [ -z "$CPANEL_SSH_KEY" ] && MISSING="$MISSING CPANEL_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required deployment secrets:$MISSING. Ensure they are configured in GitHub Settings -> Environments -> production OR Repository Secrets."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Prepare backend
        run: |
          npm ci --omit=dev --workspace @bidmylot/backend
          mkdir -p deploy/backend
          cp backend/app.js backend/package.json deploy/backend/
          cp -r backend/dist backend/migrations node_modules deploy/backend/
          rm -rf deploy/backend/node_modules/@bidmylot
          mkdir -p deploy/backend/tmp deploy/backend/uploads deploy/backend/private_uploads
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/backend/tmp/restart.txt

      - name: Upload backend via SFTP
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          TARGET_DIR="/home/${CPANEL_USER}/bidmylot.backend"

          cat << EOF > sftp_backend.batch
          -mkdir $TARGET_DIR
          -mkdir $TARGET_DIR/tmp
          -mkdir $TARGET_DIR/uploads
          -mkdir $TARGET_DIR/private_uploads
          cd $TARGET_DIR
          lcd deploy/backend
          EOF

          for item in deploy/backend/*; do
            base="$(basename "$item")"
            if [ -d "$item" ]; then
              echo "put -r $base" >> sftp_backend.batch
            elif [ -f "$item" ]; then
              echo "put $base" >> sftp_backend.batch
            fi
          done

          echo "bye" >> sftp_backend.batch

          echo "Uploading backend files and triggering Passenger restart via SFTP batch mode..."
          sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -b sftp_backend.batch "$CPANEL_USER@$CPANEL_HOST"
          echo "Backend deployment completed successfully."

      - name: Prepare frontend
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/. deploy/frontend/

      - name: Upload frontend via SFTP
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          TARGET_DIR="/home/${CPANEL_USER}/bidmylot.com"

          cat << EOF > sftp_frontend.batch
          -mkdir $TARGET_DIR
          cd $TARGET_DIR
          lcd deploy/frontend
          EOF

          for item in deploy/frontend/* deploy/frontend/.*; do
            base="$(basename "$item")"
            if [ "$base" != "." ] && [ "$base" != ".." ]; then
              if [ -d "$item" ]; then
                echo "put -r $base" >> sftp_frontend.batch
              elif [ -f "$item" ]; then
                echo "put $base" >> sftp_frontend.batch
              fi
            fi
          done

          echo "bye" >> sftp_frontend.batch

          echo "Uploading frontend bundle via SFTP batch mode..."
          sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -b sftp_frontend.batch "$CPANEL_USER@$CPANEL_HOST"
          echo "Frontend upload completed successfully."