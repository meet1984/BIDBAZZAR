name: Check BidMyLot cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate Diagnostic Secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          MISSING=""
          [ -z "$CPANEL_HOST" ] && MISSING="$MISSING CPANEL_HOST"
          [ -z "$CPANEL_USER" ] && MISSING="$MISSING CPANEL_USER"
          [ -z "$CPANEL_SSH_KEY" ] && MISSING="$MISSING CPANEL_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required diagnostic secrets:$MISSING. Check GitHub Settings -> Environments -> production OR Repository Secrets."
            exit 1
          fi
          echo "All required diagnostic secrets are present."

      - name: Start SSH agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Probe remote cPanel structure via SFTP
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          PORT="${CPANEL_PORT:-22}"
          BACKEND="/home/${CPANEL_USER}/bidmylot.backend"
          FRONTEND="/home/${CPANEL_USER}/bidmylot.com"

          cat << EOF > probe.batch
          -ls -la $BACKEND
          -ls -la $BACKEND/tmp
          -ls -la $FRONTEND
          bye
          EOF

          echo "Probing cPanel directories via SFTP subsystem..."
          sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=30 -b probe.batch "$CPANEL_USER@$CPANEL_HOST"
          echo "SFTP inspection completed successfully."