name: Check BidMyLot cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check backend and frontend files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            set -eu
            BACKEND=/home/dcgixwyd/bidmylot.backend
            FRONTEND=/home/dcgixwyd/bidmylot.com

            test -d "$BACKEND"
            test -f "$BACKEND/app.js"
            test -f "$BACKEND/dist/app.js"
            test -f "$BACKEND/package.json"
            test -f "$BACKEND/.env"
            test -d "$BACKEND/node_modules"
            test -d "$BACKEND/uploads"
            test -d "$BACKEND/private_uploads"
            test -f "$FRONTEND/index.html"
            test -f "$FRONTEND/.htaccess"

            echo "Node: $(node --version 2>/dev/null || echo 'managed by cPanel')"
            echo "Backend files: OK"
            echo "Frontend files: OK"

# Read-only check: no deployment, migration, restart or file modification.